<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#016aa5" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!--
			Shown before any JS arrives, since pages render client-side only; on the shelter's
			signal the app's code can take a while. The root layout removes it on mount. If
			that never happens (a dropped file, a dead connection), offer a reload instead of
			leaving a blank page.
		-->
		<div id="boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#f0f5fa;color:#016aa5;font-family:system-ui,sans-serif;text-align:center;padding:16px;z-index:9999">
			<p style="margin:0;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;font-size:14px">Cache Humane Society</p>
			<p id="boot-msg" style="margin:0;font-size:18px">Loading…</p>
			<button id="boot-retry" type="button" onclick="location.reload()" style="display:none;padding:10px 20px;border:0;border-radius:8px;background:#016aa5;color:#fff;font-size:16px">Try again</button>
		</div>
		<script>
			(function () {
				function stuck() {
					if (!document.getElementById('boot')) return;
					document.getElementById('boot-msg').textContent = 'Slow connection. Still trying…';
					document.getElementById('boot-retry').style.display = 'block';
				}
				setTimeout(stuck, 20000);
				// Only the app's own code failing to load means it cannot start. Other scripts
				// (analytics, often blocked) and Firebase's network errors are not that.
				function appCodeFailed() {
					if (!document.getElementById('boot')) return;
					// Usually a file from a deploy that has since been replaced: one reload
					// picks up the current one.
					try {
						if (!sessionStorage.getItem('boot-reloaded')) {
							sessionStorage.setItem('boot-reloaded', '1');
							location.reload();
							return;
						}
					} catch (e) {}
					stuck();
				}
				window.addEventListener('error', function (e) {
					var src = e.target && e.target.tagName === 'SCRIPT' ? e.target.src : '';
					if (src && src.indexOf(location.origin + '/_app/') === 0) appCodeFailed();
				}, true);
				window.addEventListener('unhandledrejection', function (e) {
					var msg = String(e.reason && e.reason.message ? e.reason.message : e.reason);
					if (/dynamically imported module|Importing a module script failed|error loading dynamically imported module/i.test(msg)) appCodeFailed();
				});
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
